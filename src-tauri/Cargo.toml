[package]
name = "ai-application-factory-desktop"
default-run = "ai-application-factory"
version = "0.1.0"
description = "Local-first AI Application Factory desktop application"
authors = ["houyu.hy <785798835@qq.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_application_factory_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-application-factory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "^2.0.0"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
